apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-infer
  labels:
    app: image-infer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-infer
  template:
    metadata:
      labels:
        app: image-infer
      annotations:
        redeploy-ts: "2025-05-11-8:26"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-master-0
      containers:
        - name: fastapi
          image: vc411892/image-infer:latest
          ports:
            - containerPort: 8001
          command: ["uvicorn"]
          args: ["app:app", "--host", "0.0.0.0", "--port", "8001"]
---
apiVersion: v1
kind: Service
metadata:
  name: image-infer
spec:
  type: NodePort
  selector:
    app: image-infer
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
      nodePort: 30501

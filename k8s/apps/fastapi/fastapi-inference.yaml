apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-infer
  labels:
    app: video-infer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-infer
  template:
    metadata:
      labels:
        app: video-infer
      annotations:
        redeploy-ts: "2025-05-10-18:17"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-master-0
      containers:
        - name: fastapi
          image: vc411892/video-infer:latest
          ports:
            - containerPort: 8000
          command: ["uvicorn"]
          args: ["app:app", "--host", "0.0.0.0", "--port", "8000"]
---
apiVersion: v1
kind: Service
metadata:
  name: video-infer
spec:
  type: NodePort
  selector:
    app: video-infer
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30500

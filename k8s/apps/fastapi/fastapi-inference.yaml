apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-infer
  labels:
    app: video-infer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-infer
  template:
    metadata:
      labels:
        app: video-infer
      annotations:
        redeploy-ts: "2025-05-10-18:01"
    spec:
      containers:
        - name: fastapi
          image: vc411892/video-infer:latest
          ports:
            - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: video-infer
spec:
  type: NodePort
  selector:
    app: video-infer
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30500


apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://community-charts.github.io/helm-charts
    chart: mlflow
    targetRevision: 0.17.2
    helm:
      values: |
        artifactRoot:
          s3:
            enabled: true
            bucket: mlflow-artifacts
            endpointUrl: http://129.114.25.200:30000
            awsAccessKeyId: minioadmin
            awsSecretAccessKey: miniopassword

        backendStore:
          mysql:
            enabled: true
            host: mlflow-mysql.default.svc.cluster.local
            port: 3306
            database: mlflowdb
            user: mlflow
            password: mlflowpass
            driver: pymysql

        mysql:
          enabled: true
          auth:
            username: mlflow
            password: mlflowpass
            database: mlflowdb

        extraEnvVars:
          MLFLOW_S3_ENDPOINT_URL: http://129.114.25.200:30000
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: miniopassword

  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

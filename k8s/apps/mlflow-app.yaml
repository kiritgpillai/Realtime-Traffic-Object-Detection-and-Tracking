apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://community-charts.github.io/helm-charts
    chart: mlflow
    targetRevision: 0.17.2
    helm:
      values: |
        artifactRoot:
          s3:
            enabled: true
            bucket: mlflow-artifacts
            awsAccessKeyId: minioadmin
            awsSecretAccessKey: miniopassword

        mysql:
          enabled: true
          auth:
            username: mlflow
            password: mlflowpass
            database: mlflowdb

        backendStore:
          mysql:
            enabled: false

        extraEnvVars:
          MLFLOW_S3_ENDPOINT_URL: http://129.114.25.200:30000
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: miniopassword

        service:
          type: NodePort
          port: 5000
          nodePort: 32000

  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
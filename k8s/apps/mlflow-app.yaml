apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://community-charts.github.io/helm-charts
    chart: mlflow
    targetRevision: 0.17.2
    helm:
      values: |
        artifactRoot:
          s3:
            enabled: true
            bucket: mlflow
            awsAccessKeyId: minioadmin
            awsSecretAccessKey: miniopassword

        backendStore:
          mysql:
            enabled: false

        mysql:
          enabled: true
          auth:
            username: mlflow
            password: mlflowpass
            database: mlflowdb
          primary:
            persistence:
              enabled: true
              existingClaim: mysql-pvc

        extraEnvVars:
          MLFLOW_S3_ENDPOINT_URL: http://129.114.25.200:30000
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: miniopassword

        service:
          type: NodePort
          port: 5000
          name: http
          annotations: {}

  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

---
- name: Disable swap
  shell: swapoff -a

- name: Comment out swap in fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*swap)'
    replace: '# \1'

- name: Install required packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - software-properties-common
    state: present
    update_cache: yes

- name: Ensure /etc/apt/keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download and dearmor Kubernetes GPG key (correct binary format)
  shell: |
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.28/deb/Release.key | \
    gpg --dearmor | tee /etc/apt/keyrings/kubernetes-apt-keyring.gpg > /dev/null
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Set correct permissions on GPG key
  file:
    path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    mode: '0644'

- name: Add Kubernetes APT repository (new community repo)
  copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    content: |
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.28/deb/ /

- name: Update apt cache
  apt:
    update_cache: yes

- name: Install Kubernetes components
  apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present

- name: Hold kubelet/kubeadm/kubectl
  shell: |
    apt-mark hold kubelet kubeadm kubectl

- name: Enable and start kubelet
  systemd:
    name: kubelet
    enabled: true
    state: started

- name: Ensure br_netfilter module is loaded
  shell: modprobe br_netfilter

- name: Set sysctl params for Kubernetes networking
  copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-ip6tables = 1
      net.bridge.bridge-nf-call-iptables  = 1
      net.ipv4.ip_forward                 = 1

- name: Apply sysctl params
  command: sysctl --system


- name: Fetch join script from master
  fetch:
    src: /tmp/kubeadm_join.sh
    dest: /tmp/kubeadm_join.sh
    flat: yes
  delegate_to: 129.114.25.200
  run_once: true

- name: Copy join script to worker
  copy:
    src: /tmp/kubeadm_join.sh
    dest: /tmp/kubeadm_join.sh
    mode: '0755'

- name: Join Kubernetes cluster
  shell: bash /tmp/kubeadm_join.sh

- name: Mount volume on k8s-worker-0
  when: inventory_hostname == "k8s-worker-0"
  mount:
    path: /mnt/minio-data
    src: /dev/vdb
    fstype: ext4
    state: mounted

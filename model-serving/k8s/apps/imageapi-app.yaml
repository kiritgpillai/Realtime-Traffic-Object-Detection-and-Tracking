apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: image-infer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:kiritgpillai/Realtime-Traffic-Object-Detection-and-Tracking.git
    targetRevision: model-serving
    path: k8s/apps/imageapi
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
